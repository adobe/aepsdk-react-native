buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    compileSdk safeExtGet('compileSdk', 34)

    def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
    if (agpVersion >= 8) {
        namespace = "com.adobe.marketing.mobile.reactnative"
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "USE_INTEROP_ROOT", "false"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled() ? "true" : "false"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig true
    }
    lintOptions {
        abortOnError false
    }

    sourceSets {
        main {
            if (!isNewArchitectureEnabled()) {
                java {
                    exclude '**/NativeAEPCoreModule.java'
                    exclude '**/NativeAEPIdentityModule.java'
                    exclude '**/NativeAEPLifecycleModule.java'
                    exclude '**/NativeAEPSignalModule.java'
                }
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation platform("com.adobe.marketing.mobile:sdk-bom:[3.8.0,4.0.0)")
    api "com.adobe.marketing.mobile:core"
    api "com.adobe.marketing.mobile:signal"
    api "com.adobe.marketing.mobile:identity"
    api "com.adobe.marketing.mobile:lifecycle"
}
